<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>月払い</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #f5f5f5; }
    @media (prefers-color-scheme: dark) { html, body { background: #121212; } }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <!-- 月払いの画面（Apps Script）をアプリの中に表示する -->
  <iframe id="payFrame" title="月払い"></iframe>
  <script>
    // index.html の API_URL と同じURL
    var API_URL = "https://script.google.com/macros/s/AKfycbwaakQiOZkfCQaPa6gdRa0qWEpOrnmW_HdDtY4nrzulSVaraO_4tgMQTvUYhjTDoA5a/exec";
    var TOKEN_KEY = 'payToken';

    // 「この端末で覚える」のログインを、このアプリ側に保存して月払いの画面に渡す
    window.addEventListener('message', function (ev) {
      if (!/\.googleusercontent\.com$/.test(new URL(ev.origin).hostname)) return;
      var msg = ev.data || {};
      try {
        if (msg.type === 'payHello') {
          ev.source.postMessage({ type: 'payToken', token: localStorage.getItem(TOKEN_KEY) || '' }, ev.origin);
        } else if (msg.type === 'paySave') {
          if (msg.token) localStorage.setItem(TOKEN_KEY, msg.token);
          else localStorage.removeItem(TOKEN_KEY);
        }
      } catch (e) {}
    });

    var back = new URL('./', location.href).href;
    document.getElementById('payFrame').src = API_URL + '?page=pay&back=' + encodeURIComponent(back);
  </script>
</body>
</html>
