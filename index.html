<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>出勤確認</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #f5f5f5;
      --card-bg: #ffffff;
      --text: #222222;
      --text-secondary: #666666;
      --border: #cccccc;
      --primary: #4A86E8;
      --primary-active: #3a6fc0;
      --badge-day: #F5A623;
      --badge-night: #3F51B5;
      --shadow: rgba(0,0,0,0.1);
      --alert: #FF0000;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --card-bg: #1e1e1e;
        --text: #eeeeee;
        --text-secondary: #aaaaaa;
        --border: #444444;
        --primary: #6fa0f5;
        --primary-active: #5688dd;
        --badge-day: #FFB74D;
        --badge-night: #7986CB;
        --shadow: rgba(0,0,0,0.5);
        --alert: #ff6b6b;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      margin: 0; padding: 16px; background: var(--bg); color: var(--text);
    }
    .header-row { display: flex; align-items: center; justify-content: center; position: relative; margin-bottom: 4px; }
    h1 { font-size: 20px; margin: 0; text-align: center; }
    .refresh-btn {
      position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--primary); font-size: 24px;
      padding: 4px 8px; cursor: pointer; line-height: 1;
    }
    .refresh-btn:disabled { opacity: 0.5; }
    .refresh-btn.spinning { animation: spin 0.8s linear infinite; }
    @keyframes spin {
      from { transform: translateY(-50%) rotate(0deg); }
      to { transform: translateY(-50%) rotate(360deg); }
    }
    .subtitle { text-align: center; font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; }
    .field { margin-bottom: 12px; }
    label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
    select {
      width: 100%; padding: 10px; font-size: 16px;
      border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text);
    }
    .period-info {
      text-align: center; font-size: 13px; font-weight: bold; color: var(--primary);
      min-height: 18px; margin: -4px 0 12px;
    }
    button#searchBtn {
      width: 100%; padding: 12px; font-size: 16px; font-weight: bold;
      color: #fff; background: var(--primary); border: none; border-radius: 8px; margin-top: 4px;
    }
    button#searchBtn:active { background: var(--primary-active); }
    .counts { display: flex; gap: 8px; margin: 16px 0 8px; }
    .count-box {
      flex: 1; background: var(--card-bg); border-radius: 8px; padding: 10px;
      text-align: center; box-shadow: 0 1px 3px var(--shadow);
    }
    .count-box .label { font-size: 12px; color: var(--text-secondary); }
    .count-box .num { font-size: 22px; font-weight: bold; }
    .count-box.day .num { color: var(--badge-day); }
    .count-box.night .num { color: var(--badge-night); }
    .last-updated { text-align: center; font-size: 11px; color: var(--text-secondary); margin-bottom: 12px; min-height: 14px; }
    .card {
      background: var(--card-bg); border-radius: 8px; padding: 12px; margin-bottom: 8px;
      box-shadow: 0 1px 3px var(--shadow);
      display: flex; align-items: center; gap: 10px;
    }
    .badge {
      display: inline-block; padding: 4px 10px; border-radius: 12px;
      font-size: 13px; font-weight: bold; color: #fff; flex-shrink: 0;
    }
    .badge.day { background: var(--badge-day); }
    .badge.night { background: var(--badge-night); }
    .card .info { flex: 1; }
    .card .date { font-size: 14px; font-weight: bold; }
    .card .address { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
    .address.alert { color: var(--alert); font-weight: bold; }
    .empty, .loading { text-align: center; color: var(--text-secondary); padding: 20px 0; font-size: 14px; }
  </style>
</head>
<body>
  <div class="header-row">
    <button id="refreshBtn" class="refresh-btn" title="更新" aria-label="更新">⟳</button>
    <h1>出勤確認</h1>
  </div>
  <div class="subtitle" id="subtitle">年月を選択してください</div>

  <div class="field">
    <label>年月</label>
    <select id="monthSelect">
      <option value="">選択してください</option>
    </select>
  </div>

  <div class="field">
    <label>名前</label>
    <select id="nameSelect" disabled>
      <option value="">先に年月を選択</option>
    </select>
  </div>

  <div class="field">
    <label>期間</label>
    <select id="periodSelect" disabled>
      <option value="全">全</option>
    </select>
  </div>
  <div class="period-info" id="periodInfo"></div>

  <button id="searchBtn">検索</button>

  <div class="counts">
    <div class="count-box day">
      <div class="label">日勤</div>
      <div class="num" id="dayCount">0</div>
    </div>
    <div class="count-box night">
      <div class="label">夜勤</div>
      <div class="num" id="nightCount">0</div>
    </div>
    <div class="count-box">
      <div class="label">合計</div>
      <div class="num" id="totalCount">0</div>
    </div>
  </div>
  <div class="last-updated" id="lastUpdated"></div>

  <div id="resultsArea"></div>

  <script>
    var API_URL = "https://script.google.com/macros/s/AKfycbwaakQiOZkfCQaPa6gdRa0qWEpOrnmW_HdDtY4nrzulSVaraO_4tgMQTvUYhjTDoA5a/exec";

    var jsonpCounter = 0;
    function jsonp(params) {
      return new Promise(function (resolve, reject) {
        var callbackName = 'jsonp_cb_' + (jsonpCounter++);
        var allParams = Object.assign({}, params, { callback: callbackName });
        var qs = Object.keys(allParams).map(function (k) {
          return encodeURIComponent(k) + '=' + encodeURIComponent(allParams[k]);
        }).join('&');

        var script = document.createElement('script');
        var timeoutId = setTimeout(function () {
          cleanup();
          reject(new Error('タイムアウトしました'));
        }, 15000);

        function cleanup() {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
          clearTimeout(timeoutId);
        }

        window[callbackName] = function (data) {
          cleanup();
          resolve(data);
        };

        script.src = API_URL + '?' + qs;
        script.onerror = function () {
          cleanup();
          reject(new Error('通信エラーが発生しました'));
        };
        document.body.appendChild(script);
      });
    }

    function formatToday() {
      var d = new Date();
      var youbi = ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
      var mm = ('0' + (d.getMonth() + 1)).slice(-2);
      var dd = ('0' + d.getDate()).slice(-2);
      return d.getFullYear() + '年' + mm + '月' + dd + '日(' + youbi + ')';
    }

    function getCurrentYm() {
      var d = new Date();
      return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
    }

    function loadMonths() {
      jsonp({ action: 'months' }).then(function (months) {
        var sel = document.getElementById('monthSelect');
        if (!months || months.length === 0) {
          sel.innerHTML = '<option value="">月一覧が空です</option>';
          return;
        }
        var currentYm = getCurrentYm();
        var matchId = '';
        months.forEach(function (m) {
          var opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = m.label;
          sel.appendChild(opt);
          if (m.ym === currentYm) matchId = m.id;
        });
        if (matchId) {
          sel.value = matchId;
          onMonthChange();
        }
      }).catch(function (err) {
        document.getElementById('monthSelect').innerHTML =
          '<option value="">エラー: ' + err.message + '</option>';
      });
    }

    var periodMeta = {};

    function updatePeriodInfo() {
      var val = document.getElementById('periodSelect').value;
      if (!val || val === '全') {
        document.getElementById('periodInfo').textContent = '';
        return;
      }
      var startLabel = periodMeta[val] || '';
      var text = startLabel ? (startLabel + '〜' + val) : val;
      document.getElementById('periodInfo').textContent = '表示期間: ' + text;
    }

    function onMonthChange() {
      var monthSel = document.getElementById('monthSelect');
      var monthId = monthSel.value;
      var nameSel = document.getElementById('nameSelect');
      var periodSel = document.getElementById('periodSelect');

      document.getElementById('resultsArea').innerHTML = '';
      document.getElementById('dayCount').textContent = 0;
      document.getElementById('nightCount').textContent = 0;
      document.getElementById('totalCount').textContent = 0;
      document.getElementById('periodInfo').textContent = '';
      document.getElementById('lastUpdated').textContent = '';

      if (!monthId) {
        nameSel.disabled = true;
        periodSel.disabled = true;
        nameSel.innerHTML = '<option value="">先に年月を選択</option>';
        return;
      }

      nameSel.innerHTML = '<option value="">読み込み中...</option>';
      periodSel.innerHTML = '<option value="全">全</option>';
      nameSel.disabled = true;
      periodSel.disabled = true;

      jsonp({ action: 'names', month: monthId }).then(function (names) {
        nameSel.innerHTML = '<option value="">選択してください</option>';
        names.forEach(function (n) {
          var opt = document.createElement('option');
          opt.value = n;
          opt.textContent = n;
          nameSel.appendChild(opt);
        });
        nameSel.disabled = false;
      }).catch(function (err) {
        nameSel.innerHTML = '<option value="">エラー: ' + err.message + '</option>';
      });

      jsonp({ action: 'periods', month: monthId }).then(function (periods) {
        periodSel.innerHTML = '';
        periodMeta = {};
        periods.forEach(function (p) {
          var opt = document.createElement('option');
          opt.value = p.label;
          opt.textContent = p.label;
          if (p.label === '全') opt.selected = true;
          periodSel.appendChild(opt);
          periodMeta[p.label] = p.startLabel;
        });
        periodSel.disabled = false;
        updatePeriodInfo();
      }).catch(function (err) {
        periodSel.innerHTML = '<option value="">エラー: ' + err.message + '</option>';
      });
    }

    function updateLastUpdated() {
      var d = new Date();
      var hh = ('0' + d.getHours()).slice(-2);
      var mm = ('0' + d.getMinutes()).slice(-2);
      document.getElementById('lastUpdated').textContent = '最終更新: ' + hh + ':' + mm;
    }

    function doSearch(forceRefresh) {
      var monthId = document.getElementById('monthSelect').value;
      var name = document.getElementById('nameSelect').value;
      var period = document.getElementById('periodSelect').value;
      var resultsArea = document.getElementById('resultsArea');

      if (!monthId) {
        resultsArea.innerHTML = '<div class="empty">年月を選択してください</div>';
        return Promise.resolve();
      }
      if (!name) {
        resultsArea.innerHTML = '<div class="empty">名前を選択してください</div>';
        document.getElementById('dayCount').textContent = 0;
        document.getElementById('nightCount').textContent = 0;
        document.getElementById('totalCount').textContent = 0;
        return Promise.resolve();
      }

      resultsArea.innerHTML = '<div class="loading">検索中...</div>';

      return jsonp({
        action: 'search',
        month: monthId,
        name: name,
        period: period,
        refresh: forceRefresh ? '1' : '0'
      }).then(function (data) {
        document.getElementById('dayCount').textContent = data.dayCount;
        document.getElementById('nightCount').textContent = data.nightCount;
        document.getElementById('totalCount').textContent = data.dayCount + data.nightCount;
        updateLastUpdated();

        if (data.results.length === 0) {
          resultsArea.innerHTML = '<div class="empty">該当するデータがありません</div>';
          return;
        }

        var html = '';
        data.results.forEach(function (row) {
          var date = row[0], shift = row[1], address = row[2], isAlert = row[3], alertColor = row[4];
          var badgeClass = shift === '夜' ? 'night' : 'day';
          var addressClass = isAlert ? 'address alert' : 'address';
          var alertStyle = isAlert && alertColor ? ' style="color:' + alertColor + '"' : '';
          html += '<div class="card">' +
            '<span class="badge ' + badgeClass + '">' + shift + '</span>' +
            '<div class="info">' +
              '<div class="date">' + date + '</div>' +
              '<div class="' + addressClass + '"' + alertStyle + '>' + address + '</div>' +
            '</div></div>';
        });
        resultsArea.innerHTML = html;
      }).catch(function (err) {
        resultsArea.innerHTML = '<div class="empty">エラー: ' + err.message + '</div>';
      });
    }

    function doRefresh() {
      var btn = document.getElementById('refreshBtn');
      if (btn.disabled) return;
      btn.disabled = true;
      btn.classList.add('spinning');
      doSearch(true).then(function () {
        btn.classList.remove('spinning');
        btn.disabled = false;
      });
    }

    document.getElementById('monthSelect').addEventListener('change', onMonthChange);
    document.getElementById('periodSelect').addEventListener('change', updatePeriodInfo);
    document.getElementById('searchBtn').addEventListener('click', function () { doSearch(false); });
    document.getElementById('refreshBtn').addEventListener('click', doRefresh);
    document.getElementById('subtitle').textContent = formatToday();
    loadMonths();
  </script>
</body>
</html>
