<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0060A0">
  <title>出勤確認</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #ffffff;
      --text: #16212c;
      --text-secondary: #5b6875;
      --border: #d5dfe9;
      --primary: #0060A0;
      --primary-active: #004d82;
      --green: #40A040;
      --badge-day: #c98a00;
      --badge-night: #0a3c8c;
      --field-bg: #f2f6fa;
      --day-bg: #fff7dc;
      --night-bg: #e8f0ff;
      --total-bg: #eef7ee;
      --total-text: #2a7a2a;
      --shadow: rgba(0,0,0,0.1);
      --alert: #FF0000;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101820;
        --card-bg: #19232e;
        --text: #e5eaf0;
        --text-secondary: #a9b6c3;
        --border: #2c3b4b;
        --primary: #6aa8dc;
        --primary-active: #4f8fc6;
        --green: #6cc46c;
        --badge-day: #ffc84a;
        --badge-night: #9fc0ff;
        --field-bg: #1f2d3b;
        --day-bg: #2c2512;
        --night-bg: #16243d;
        --total-bg: #1b3220;
        --total-text: #8fd88f;
        --shadow: rgba(0,0,0,0.5);
        --alert: #ff6b6b;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      margin: 0; padding: 16px; background: var(--bg); color: var(--text);
    }
    .header-row { display: flex; align-items: center; justify-content: center; position: relative; margin-bottom: 4px; }
    h1 { font-size: 20px; margin: 0; text-align: center; }
    .refresh-btn {
      position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--primary); font-size: 24px;
      padding: 4px 8px; cursor: pointer; line-height: 1;
    }
    .refresh-btn:disabled { opacity: 0.5; }
    .refresh-btn.spinning { animation: spin 0.8s linear infinite; }
    .more-btn {
      position: absolute; right: 0; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--primary); font-size: 26px;
      padding: 4px 8px; cursor: pointer; line-height: 1;
    }
    .more-menu {
      position: absolute; right: 0; top: 100%; z-index: 1000; min-width: 150px;
      background: var(--card-bg); border-radius: 8px; overflow: hidden;
      box-shadow: 0 2px 8px var(--shadow); border: 1px solid var(--border);
    }
    .more-menu a { display: block; padding: 14px 16px; color: var(--text); text-decoration: none; font-size: 16px; }
    .more-menu a:active { background: var(--bg); }
    @keyframes spin {
      from { transform: translateY(-50%) rotate(0deg); }
      to { transform: translateY(-50%) rotate(360deg); }
    }
    .subtitle { text-align: center; font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; }
    .mode-toggle { display: flex; gap: 8px; margin-bottom: 16px; }
    .mode-toggle button {
      flex: 1; padding: 10px; font-size: 15px; font-weight: bold;
      border-radius: 8px; border: 1px solid var(--primary);
      background: var(--card-bg); color: var(--primary); cursor: pointer;
    }
    .mode-toggle button.active { background: var(--primary); color: #fff; }
    .field { margin-bottom: 12px; }
    label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
    select {
      width: 100%; padding: 10px; font-size: 16px;
      border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text);
    }
    .period-info {
      text-align: center; font-size: 13px; font-weight: bold; color: var(--primary);
      min-height: 18px; margin: -4px 0 12px;
    }
    button#searchBtn {
      width: 100%; padding: 12px; font-size: 16px; font-weight: bold;
      color: #fff; background: var(--primary); border: none; border-radius: 8px; margin-top: 4px;
    }
    button#searchBtn:active { background: var(--primary-active); }
    .counts { display: flex; gap: 8px; margin: 16px 0 8px; }
    .count-box {
      flex: 1; background: var(--card-bg); border-radius: 8px; padding: 10px;
      text-align: center; box-shadow: 0 1px 3px var(--shadow);
    }
    .count-box .label { font-size: 12px; color: var(--text-secondary); }
    .count-box .num { font-size: 22px; font-weight: bold; }
    .count-box.day .num { color: var(--badge-day); }
    .count-box.night .num { color: var(--badge-night); }
    .last-updated { text-align: center; font-size: 11px; color: var(--text-secondary); margin: 12px 0; min-height: 14px; }
    .card {
      background: var(--card-bg); border-radius: 8px; padding: 12px; margin-bottom: 8px;
      box-shadow: 0 1px 3px var(--shadow);
      display: flex; align-items: center; gap: 10px;
    }
    .badge {
      display: inline-block; padding: 4px 10px; border-radius: 12px;
      font-size: 13px; font-weight: bold; color: #fff; flex-shrink: 0;
    }
    .badge.day { background: var(--badge-day); }
    .badge.night { background: var(--badge-night); }
    .card .info { flex: 1; }
    .card .date { font-size: 14px; font-weight: bold; }
    .card .address { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
    .address.alert { color: var(--alert); font-weight: bold; }
    .times { color: var(--primary); font-weight: bold; margin-left: 8px; }
    .empty, .loading { text-align: center; color: var(--text-secondary); padding: 20px 0; font-size: 14px; }
    .sum-head, .sum-row { display: flex; align-items: center; gap: 6px; }
    .sum-head { font-size: 12px; color: var(--text-secondary); padding: 0 12px 4px; }
    .sum-row {
      background: var(--card-bg); border-radius: 8px; padding: 10px 12px; margin-bottom: 6px;
      box-shadow: 0 1px 3px var(--shadow);
    }
    .sum-row.paid { opacity: 0.55; }
    .sum-name { flex: 1; min-width: 0; font-size: 15px; font-weight: bold; overflow-wrap: anywhere; }
    .sum-head .sum-name { font-size: 12px; font-weight: normal; }
    .sum-num { width: 40px; text-align: center; font-size: 16px; font-weight: bold; }
    .sum-head .sum-num { font-size: 12px; font-weight: normal; }
    .sum-num.day { color: var(--badge-day); }
    .sum-num.night { color: var(--badge-night); }
    .sum-check { width: 44px; text-align: center; }
    .sum-check input { width: 24px; height: 24px; accent-color: var(--primary); }
    .sum-type { width: 30px; flex-shrink: 0; text-align: center; }
    .type-btn {
      width: 26px; height: 26px; padding: 0; border-radius: 50%;
      border: 2px solid var(--primary); background: transparent; color: var(--primary);
      font-size: 11px; font-weight: bold; line-height: 22px; cursor: pointer;
    }
    .type-btn.on { border-color: var(--text-secondary); background: var(--text-secondary); color: var(--card-bg); }
    .type-btn:disabled { opacity: 0.4; }
    .sum-row.monthly { opacity: 0.45; }
    .sum-section { font-size: 12px; color: var(--text-secondary); margin: 14px 4px 6px; }
    .sum-total {
      display: flex; align-items: center; gap: 6px; margin: 10px 0 4px; padding: 12px;
      border-radius: 8px; border: 2px solid var(--primary); background: var(--card-bg);
    }
    .sum-total .sum-name { font-size: 15px; }
    .sum-total-note { text-align: right; font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
    /* 週払い：名前を押すと、その人の勤務（個人検索と同じ）を下に開く */
    .sum-row .sum-name.link { cursor: pointer; color: var(--primary); }
    .sum-row .sum-name.link::after { content: ' ▸'; font-size: 12px; }
    .sum-row.open .sum-name.link::after { content: ' ▾'; }
    .sum-detail { margin: -2px 0 10px 14px; padding-left: 10px; border-left: 3px solid var(--primary); }
    .sum-detail .card { box-shadow: none; border: 1px solid var(--border, #ddd); padding: 8px 10px; margin-bottom: 6px; }
    .sum-detail .detail-count { font-size: 12px; color: var(--text-secondary); margin: 4px 0 6px; }
    .sum-detail .empty, .sum-detail .loading { padding: 8px 0; }
    .name-filter { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; }
    .name-filter input { flex: 1; min-width: 0; padding: 10px 12px; font-size: 16px; border-radius: 8px;
      border: 1px solid var(--border, #ccc); background: var(--card-bg); color: inherit; }
    .name-filter .filter-info { font-size: 13px; color: var(--text-secondary); min-width: 32px; text-align: right; }
    .sum-item[hidden] { display: none; }
    .unknown-card {
      background: var(--card-bg); border: 1px solid #E67E22; border-radius: 8px;
      padding: 10px 12px; margin-bottom: 12px; font-size: 13px;
    }
    .unknown-card summary { cursor: pointer; font-weight: bold; color: #E67E22; font-size: 14px; }
    .unknown-note { color: var(--text-secondary); font-size: 12px; margin: 6px 0 8px; }
    .unknown-item { display: flex; gap: 8px; padding: 5px 0; border-top: 1px solid var(--border); }
    .unknown-name { font-weight: bold; min-width: 0; overflow-wrap: anywhere; }
    .unknown-meta { color: var(--text-secondary); margin-left: auto; text-align: right; font-size: 12px; flex-shrink: 0; }
    .print-btn {
      width: 100%; padding: 12px; font-size: 16px; font-weight: bold; margin-top: 8px;
      color: var(--primary); background: var(--card-bg);
      border: 1px solid var(--primary); border-radius: 8px; cursor: pointer;
    }
    /* 週払いの印刷（A4縦1枚）：パソコンの管理画面の印刷と同じ形（2026-11-17） */
    #printArea { display: none; }
    #printArea.wkp-measure { display: block; position: absolute; left: -10000px; top: 0; width: 210mm; visibility: hidden; }
    #printArea * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #printArea { font-family: "Yu Gothic", "Meiryo", "Hiragino Sans", sans-serif; font-size: 12pt; color: #1b2a36; background: #fff; }
    #printArea .wkp-page { width: 210mm; padding: 10mm 10mm 8mm; margin: 0 auto; }
    #printArea .wkp-printed { text-align: right; font-size: .7em; color: #5a6b78; }
    #printArea .wkp-head { display: flex; align-items: center; padding-bottom: 1.5mm; border-bottom: 3px solid #40A040; font-weight: bold; color: #0060A0; }
    #printArea .wkp-head > div { flex: 1; }
    #printArea .wkp-head .ym { font-size: 1.4em; }
    #printArea .wkp-head .t { font-size: 1.8em; letter-spacing: .5em; text-align: center; }
    #printArea .wkp-head .co { display: flex; align-items: center; justify-content: flex-end; gap: .4em; font-size: 1em; }
    #printArea .wkp-head .co img { height: 2.2em; width: auto; }
    #printArea .wkp-range { display: flex; justify-content: space-between; align-items: baseline; margin: 2.5mm 0 3mm; }
    #printArea .wkp-range b { font-size: 1.15em; color: #0060A0; }
    #printArea .wkp-range span { font-size: .8em; color: #5a6b78; }
    #printArea table { width: 100%; border-collapse: collapse; table-layout: fixed; border: 1.5px solid #0060A0; }
    #printArea th, #printArea td { border-top: 1px solid #9db8cf; border-bottom: 1px solid #9db8cf; border-left: 1px dotted #9db8cf; padding: .3em .45em; text-align: center; white-space: nowrap; overflow: hidden; color: #1b2a36; font-size: 1em; }
    #printArea th { background: #0060A0; color: #fff; border-color: #0060A0; border-left: 1px solid #3f86bd; font-weight: bold; }
    #printArea th:first-child { border-left: 0; }
    #printArea th.rb, #printArea td.rb { border-left: 1.5px solid #0060A0 !important; }
    #printArea td.nm { text-align: left; font-weight: bold; border-left: 1px solid #9db8cf; }
    #printArea td.nm:first-child { border-left: 0; }
    #printArea td.t { font-weight: bold; }
    #printArea tr.odd td { background: #eef5fb; }
    #printArea tr.sum td { background: #40A040; color: #fff; font-weight: bold; border-color: #40A040; }
    @media print {
      @page { size: A4 portrait; margin: 0; }
      body.print-summary { background: #fff; color: #000; padding: 0 !important; margin: 0 !important; }
      body.print-summary > *:not(#printArea) { display: none !important; }
      body.print-summary #printArea { display: block; position: static; visibility: visible; width: 210mm; }
    }
    /* ログインの案内（ログインしていない端末だけ） */
    #loginGate { position: fixed; inset: 0; z-index: 1000; background: var(--bg); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; box-sizing: border-box; }
    #loginGate[hidden] { display: none; }
    #loginGate .lg-card { background: var(--card-bg); color: var(--text); border-radius: 14px; box-shadow: 0 2px 10px var(--shadow); padding: 24px 20px; max-width: 420px; width: 100%; box-sizing: border-box; }
    #loginGate .lg-icon { font-size: 34px; text-align: center; }
    #loginGate h2 { text-align: center; font-size: 20px; margin: 6px 0 12px; }
    #loginGate p { font-size: 15px; line-height: 1.7; margin: 8px 0; }
    #loginGate ol { font-size: 15px; line-height: 1.7; padding-left: 22px; margin: 12px 0 18px; }
    #loginGate .lg-btn { display: block; text-align: center; background: var(--primary); color: #fff; text-decoration: none; font-size: 17px; font-weight: bold; padding: 14px; border-radius: 10px; }
    #loginGate .lg-btn:active { background: var(--primary-active); }
    #loginGate .lg-note { font-size: 13px; color: var(--text-secondary); text-align: center; margin-top: 14px; }

    /* ===== 見た目：A シグネチャー（打刻とおそろい：会社の青 #0060A0 と緑 #40A040） ===== */
    body { padding: 0 14px calc(78px + env(safe-area-inset-bottom, 0px)); max-width: 720px; margin: 0 auto; }
    .app-bar { position: sticky; top: 0; z-index: 900; display: flex; align-items: center; gap: 9px;
      margin: 0 -14px 4px; padding: 9px 8px 9px 12px; background: #0060A0; color: #fff; min-height: 54px; }
    .app-bar .ab-stripe { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .app-bar .ab-stripe::after { content: ""; position: absolute; right: -22px; top: 0; bottom: 0; width: 92px; background: #40A040; transform: skewX(-30deg); }
    .app-bar > *:not(.ab-stripe):not(.more-menu) { position: relative; z-index: 1; }
    .ab-logo { width: 34px; height: 34px; border-radius: 8px; background: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .ab-logo img { width: 30px; height: 30px; object-fit: contain; display: block; }
    .app-bar h1 { font-size: 18px; letter-spacing: .04em; text-align: left; flex: 1; min-width: 0; color: #fff; }
    .app-bar .refresh-btn, .app-bar .more-btn { position: static; transform: none; color: #fff; width: 40px; height: 40px; padding: 0; font-size: 24px; flex-shrink: 0; }
    .app-bar .refresh-btn.spinning { animation: abspin 0.8s linear infinite; }
    @keyframes abspin { to { transform: rotate(360deg); } }
    .app-bar .more-menu { top: 100%; right: 8px; margin-top: 2px; }
    .subtitle { text-align: left; font-weight: bold; color: var(--text-secondary); border-left: 5px solid #40A040; padding: 1px 0 1px 9px; margin: 10px 0 12px; }
    .mode-toggle { background: var(--field-bg); border-radius: 12px; padding: 3px; gap: 3px; }
    .mode-toggle button { border: none; border-radius: 9px; background: transparent; color: var(--text-secondary); }
    .mode-toggle button.active { background: var(--card-bg); color: var(--primary); box-shadow: 0 1px 3px var(--shadow); }
    .period-info:empty { min-height: 0; margin: 0 0 6px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .field { margin-bottom: 10px; }
    label { font-weight: bold; font-size: 12px; }
    select { background: var(--field-bg); border-color: var(--border); border-radius: 10px; font-weight: bold; min-height: 46px; }
    button#searchBtn { border-radius: 12px; min-height: 48px; background: #0060A0; }
    button#searchBtn:active { background: #004d82; }
    .counts { gap: 8px; }
    .count-box { border-radius: 12px; box-shadow: none; }
    .count-box .label { font-weight: bold; font-size: 12px; }
    .count-box .num { font-size: 26px; }
    .count-box.day { background: var(--day-bg); } .count-box.day .label { color: var(--badge-day); }
    .count-box.night { background: var(--night-bg); } .count-box.night .label { color: var(--badge-night); }
    .count-box.total { background: var(--total-bg); } .count-box.total .label, .count-box.total .num { color: var(--total-text); }
    .card { border-radius: 12px; box-shadow: none; border: 1px solid var(--border); border-left: 5px solid #f5b400; }
    .card.night { border-left-color: var(--badge-night); }
    .badge { width: 32px; height: 32px; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .badge svg { width: 18px; height: 18px; }
    .badge.day { background: var(--day-bg); color: #e0a000; }
    .badge.night { background: var(--night-bg); color: var(--badge-night); }
    .sum-row, .sum-total { border-radius: 12px; }
    .sum-total { border-color: #40A040; }
    .print-btn { border-radius: 12px; }
    .retry-btn { width: 100%; min-height: 44px; margin: -2px 0 10px; border-radius: 10px; border: 1px solid var(--primary); background: var(--card-bg); color: var(--primary); font-size: 15px; font-weight: bold; }
    .retry-btn[hidden] { display: none; }
    /* いちばん下のメニュー */
    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 720px; z-index: 950; display: flex; background: #0060A0; box-shadow: 0 -2px 8px rgba(0,0,0,.15); }
    .bottom-nav a, .bottom-nav button { flex: 1 1 0; min-width: 0; border: none; background: transparent; color: #d6e6f5; font: inherit; font-size: 12px; font-weight: bold; text-align: center; text-decoration: none; padding: 8px 4px calc(9px + env(safe-area-inset-bottom, 0px)); cursor: pointer; }
    .bottom-nav svg { width: 22px; height: 22px; display: block; margin: 0 auto 3px; }
    .bottom-nav .on { background: #40A040; color: #fff; }
    body.need-login .bottom-nav { display: none; }
    /* 他社（グロウス）に切り替えたとき：自社の青・緑とまったく違う色にして、上に会社名を出す */
    .co-tag { display: none; font-size: 12px; font-weight: bold; background: #fff; color: #B4440F; border-radius: 6px; padding: 2px 7px; margin-left: 6px; vertical-align: 2px; }
    body.co-other { --primary: #C2410C; --primary-active: #9A3412; }
    body.co-other .co-tag { display: inline-block; }
    body.co-other .app-bar { background: #C2410C; }
    body.co-other .app-bar .ab-stripe::after { background: #F59E0B; }
    body.co-other .subtitle { border-left-color: #F59E0B; }
    body.co-other button#searchBtn { background: #C2410C; }
    body.co-other button#searchBtn:active { background: #9A3412; }
    body.co-other .sum-total { border-color: #F59E0B; }
    body.co-other .bottom-nav { display: none; }
    body.co-other { padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
    body.co-other .sum-type .type-btn { visibility: hidden; }
    body.co-other #payLink, body.co-other #billLink, body.co-other #otLink, body.co-other #chartLink, body.co-other #nskLink { display: none; }
    .mode-toggle #modeDaily { display: none; }
    body.co-other .mode-toggle #modeDaily { display: block; }
    body.co-other .mode-toggle #modeWeekly { order: 1; } body.co-other .mode-toggle #modeDaily { order: 2; } body.co-other .mode-toggle #modePersonal { order: 3; }
    /* 出勤確認の横の切り替えボタン（他社を見られる人だけ） */
    /* I・C・S ／ グロウス の2つのボタン。今見ている方が白くなる */
    .app-bar h1 { flex: 0 0 auto; white-space: nowrap; }
    .app-bar .co-seg { display: flex; flex-shrink: 1; min-width: 0; margin-right: auto; border: 2px solid #fff; border-radius: 999px; overflow: hidden; }
    .app-bar .co-seg[hidden] { display: none; }
    .app-bar .co-seg button { border: none; background: transparent; color: #fff; font: inherit; font-size: 12px; font-weight: bold; padding: 5px 8px; cursor: pointer; white-space: nowrap; }
    .app-bar .co-seg button.on { background: #fff; color: #0060A0; }
    @media (max-width: 390px) { .app-bar { gap: 6px; } .app-bar h1 { font-size: 16px; } .app-bar .co-seg button { padding: 5px 6px; } }
    body.co-other .app-bar .co-seg button.on { color: #C2410C; }
    body.co-other .co-tag, .co-tag { display: none !important; }
    .more-menu a.co-switch { font-weight: bold; color: #C2410C; border-top: 1px solid var(--border); }
    body.co-other .more-menu a.co-switch { color: #0060A0; }
    /* 日払いの一覧 */
    .day-sec { margin: 14px 0 6px; font-weight: bold; font-size: 14px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
    .day-sec .n { margin-left: auto; font-size: 13px; }
    .day-row { display: flex; align-items: center; gap: 10px; background: var(--card-bg); border: 1px solid var(--border); border-left: 5px solid #f5b400; border-radius: 12px; padding: 9px 10px; margin-bottom: 6px; }
    .day-row.night { border-left-color: var(--badge-night); }
    .day-row .dn { font-weight: bold; font-size: 16px; min-width: 0; }
    .day-row .dn .times { font-size: 13px; }
    .day-row .ds { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .day-row .dm { flex: 1; min-width: 0; }
    .day-row input { width: 24px; height: 24px; accent-color: var(--primary); flex-shrink: 0; }
    .day-row.paid { opacity: .5; }
  </style>
</head>
<body>
  <div class="app-bar">
    <span class="ab-stripe" aria-hidden="true"></span>
    <span class="ab-logo"><img src="icon.png" alt=""></span>
    <h1>出勤確認<span class="co-tag" id="coTag"></span></h1>
    <div class="co-seg" id="coSeg" hidden>
      <button type="button" id="coSelf" class="on">I・C・S</button>
      <button type="button" id="coOther"></button>
    </div>
    <button id="refreshBtn" class="refresh-btn" title="更新" aria-label="更新">⟳</button>
    <button id="moreBtn" class="more-btn" title="メニュー" aria-label="メニュー">⋮</button>
    <div id="moreMenu" class="more-menu" hidden>
      <a id="payLink" href="pay.html">月払い</a>
      <a id="billLink" href="pay.html?view=bill">請求額</a>
      <a id="otLink" href="pay.html?view=ot">定時後残業</a>
      <a id="chartLink" href="pay.html?view=chart">グラフ（売上・人件費）</a>
      <a id="nskLink" href="pay.html?view=nsk">NSK集計</a>
      <a id="coLink" class="co-switch" href="#" hidden></a>
    </div>
  </div>
  <div class="subtitle" id="subtitle">年月を選択してください</div>

  <div class="mode-toggle">
    <button id="modePersonal" class="active">個人検索</button>
    <button id="modeWeekly">週払い</button>
    <button id="modeDaily">日払い</button>
  </div>

  <div class="field-row">
    <div class="field">
      <label for="monthSelect">年月</label>
      <select id="monthSelect">
        <option value="">選択してください</option>
      </select>
    </div>
    <div class="field" id="periodField">
      <label for="periodSelect">期間</label>
      <select id="periodSelect" disabled>
        <option value="全">全</option>
      </select>
    </div>
    <div class="field" id="dayField" hidden>
      <label for="daySelect">日</label>
      <select id="daySelect" disabled>
        <option value="">先に年月を選択</option>
      </select>
    </div>
  </div>
  <button type="button" id="retryBtn" class="retry-btn" hidden>⟳ もう一度読む</button>

  <div class="field" id="nameField">
    <label for="nameSelect">名前</label>
    <select id="nameSelect" disabled>
      <option value="">先に年月を選択</option>
    </select>
  </div>
  <div class="period-info" id="periodInfo"></div>

  <button id="searchBtn">検索</button>

  <div class="counts" id="counts">
    <div class="count-box day">
      <div class="label">日勤</div>
      <div class="num" id="dayCount">0</div>
    </div>
    <div class="count-box night">
      <div class="label">夜勤</div>
      <div class="num" id="nightCount">0</div>
    </div>
    <div class="count-box total">
      <div class="label">合計</div>
      <div class="num" id="totalCount">0</div>
    </div>
  </div>
  <div class="last-updated" id="lastUpdated"></div>

  <div id="resultsArea"></div>
  <div id="printArea"></div>

  <nav class="bottom-nav" aria-label="メニュー">
    <button type="button" id="navWeekly"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7 14h3M7 17h3"/></svg>週払い</button>
    <a href="pay.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="3"/><path d="M6 9.5v6M18 9.5v6"/></svg>月払い</a>
    <a href="pay.html?view=bill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M9 19h4"/></svg>請求額</a>
  </nav>

  <script>
    var API_URL = "https://script.google.com/macros/s/AKfycbwaakQiOZkfCQaPa6gdRa0qWEpOrnmW_HdDtY4nrzulSVaraO_4tgMQTvUYhjTDoA5a/exec";

    // ── ログイン ──
    // 出勤確認のデータは、月払いの画面で暗証番号を入れて「この端末で覚える」にしたスマホ・パソコンだけが見られる。
    // 覚えたログイン（payToken）は月払いの画面と同じもの（90日間）。暗証番号そのものは、この画面では送らない
    function savedToken() { try { return localStorage.getItem('payToken') || ''; } catch (e) { return ''; } }
    function showLogin(why) {
      var g = document.getElementById('loginGate');
      if (!g) {
        g = document.createElement('div');
        g.id = 'loginGate';
        g.setAttribute('role', 'dialog');
        g.setAttribute('aria-modal', 'true');
        g.innerHTML = '<div class="lg-card"><div class="lg-icon">🔒</div><h2>ログインしてください</h2>' +
          '<p id="loginWhy"></p>' +
          '<ol><li>下の「ログインする」を押します（月払いの画面が開きます）。</li>' +
          '<li>暗証番号を入れます。「この端末で覚える」には<b>チェックを入れたまま</b>にします。</li>' +
          '<li>左上の「‹ 出勤確認」で、この画面にもどります。</li></ol>' +
          '<a class="lg-btn" href="pay.html">ログインする</a>' +
          '<p class="lg-note">一度ログインすると、このスマホ（パソコン）は90日間覚えています。</p></div>';
        document.body.appendChild(g);
      }
      document.getElementById('loginWhy').textContent = why || '出勤確認を見るには、ログインが必要です。';
      g.hidden = false;
      document.body.classList.add('need-login');
    }

    // ── 他社（グロウス）への切り替え ──
    //  ⋮ メニューで切り替える。見られる人（NSK を見られる人・スマホ）だけにボタンが出る。
    //  切り替えている間は、サーバーへの問い合わせに co=g を付けて、他社の出勤簿を読む（このタブを閉じると自社に戻る）
    var CO = '';
    try { CO = sessionStorage.getItem('coOther') === '1' ? 'g' : ''; } catch (e) {}
    function setCo(on) {
      try { if (on) sessionStorage.setItem('coOther', '1'); else sessionStorage.removeItem('coOther'); } catch (e) {}
      location.hash = '';
      location.reload();
    }

    var jsonpCounter = 0;
    // サーバーへの問い合わせ。まず fetch で読む（サーバーがエラーの画面を返したときも、その中身を見て理由を出せる）。
    // fetch が使えないときだけ、前からのやり方（JSONP）で読む
    function jsonp(params) {
      if (CO && params.action !== 'setPayType' && params.action !== 'payTypes') params = Object.assign({ co: CO }, params);
      return jsonpRaw(params).then(function (data) {
        // サーバーが「見られません」などを返したとき（ログイン切れは、その前に案内を出している）
        if (data && data.error && typeof data.error === 'string' && params.action !== 'setPayType') throw new Error(data.error);
        return data;
      });
    }
    function jsonpRaw(params) {
      var allParams = Object.assign({ token: savedToken() }, params);
      var qs = Object.keys(allParams).map(function (k) {
        return encodeURIComponent(k) + '=' + encodeURIComponent(allParams[k]);
      }).join('&');
      if (!window.fetch || !window.AbortController) return jsonpOld(params);
      var ctrl = new AbortController();
      var timer = setTimeout(function () { ctrl.abort(); }, 25000);
      return fetch(API_URL + '?' + qs, { method: 'GET', redirect: 'follow', signal: ctrl.signal, credentials: 'omit' })
        .then(function (res) { return res.text(); }, function (err) {
          clearTimeout(timer);
          if (err && err.name === 'AbortError') throw new Error('タイムアウトしました（25秒たっても返事がありません）');
          return { fallback: true };
        })
        .then(function (text) {
          clearTimeout(timer);
          if (text && text.fallback) return jsonpOld(params);
          var data;
          try { data = JSON.parse(text); }
          catch (e) {
            // JSON ではない＝サーバー（Apps Script）がエラーの画面を返した
            var msg = String(text || '').replace(/<style[\s\S]*?<\/style>|<script[\s\S]*?<\/script>/gi, ' ')
              .replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 120);
            throw new Error('サーバーでエラー：' + (msg || '（中身が空）'));
          }
          if (data && data.error === 'login') {
            showLogin(savedToken() ? 'ログインの期限が切れたか、ログインが取り消されました。もう一度ログインしてください。' : '');
            throw new Error('ログインが必要です');
          }
          return data;
        });
    }
    function jsonpOld(params) {
      return new Promise(function (resolve, reject) {
        var callbackName = 'jsonp_cb_' + (jsonpCounter++);
        var allParams = Object.assign({ token: savedToken() }, params, { callback: callbackName });
        var qs = Object.keys(allParams).map(function (k) {
          return encodeURIComponent(k) + '=' + encodeURIComponent(allParams[k]);
        }).join('&');

        var script = document.createElement('script');
        var timeoutId = setTimeout(function () {
          cleanup();
          reject(new Error('タイムアウトしました'));
        }, 15000);

        function cleanup() {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
          clearTimeout(timeoutId);
        }

        window[callbackName] = function (data) {
          cleanup();
          if (data && data.error === 'login') {
            showLogin(savedToken() ? 'ログインの期限が切れたか、ログインが取り消されました。もう一度ログインしてください。' : '');
            reject(new Error('ログインが必要です'));
            return;
          }
          resolve(data);
        };

        script.src = API_URL + '?' + qs;
        script.onerror = function () {
          cleanup();
          reject(new Error('通信エラーが発生しました'));
        };
        document.body.appendChild(script);
      });
    }

    function formatToday() {
      var d = new Date();
      var youbi = ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
      var mm = ('0' + (d.getMonth() + 1)).slice(-2);
      var dd = ('0' + d.getDate()).slice(-2);
      return d.getFullYear() + '年' + mm + '月' + dd + '日(' + youbi + ')';
    }

    function getCurrentYm() {
      var d = new Date();
      return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
    }

    function loadMonths() {
      jsonp({ action: 'months' }).then(function (months) {
        var sel = document.getElementById('monthSelect');
        if (!months || months.length === 0) {
          sel.innerHTML = '<option value="">月一覧が空です</option>';
          return;
        }
        var currentYm = getCurrentYm();
        var matchId = '';
        months.forEach(function (m) {
          var opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = m.label;
          opt.setAttribute('data-ym', m.ym || '');
          sel.appendChild(opt);
          if (m.ym === currentYm) matchId = m.id;
        });
        if (matchId) {
          sel.value = matchId;
          onMonthChange();
        }
      }).catch(function (err) {
        document.getElementById('monthSelect').innerHTML =
          '<option value="">エラー: ' + err.message + '</option>';
        if (err.message !== 'ログインが必要です') document.getElementById('retryBtn').hidden = false;
      });
    }

    var periodMeta = {};
    var periodList = [];   // 期間の並び（印刷の「11/12(木) 夜勤 〜 11/19(木) 日勤」を作るのに使う）
    var summaryLoadedAt = null;   // 週払いの一覧を読んだ時刻（印刷の「○時点の出勤簿」）
    var currentMode = 'personal';
    var lastSummary = null;

    function updatePeriodInfo() {
      var val = document.getElementById('periodSelect').value;
      if (!val || val === '全') {
        document.getElementById('periodInfo').textContent = '';
        return;
      }
      var startLabel = periodMeta[val] || '';
      var text = startLabel ? (startLabel + '〜' + val) : val;
      document.getElementById('periodInfo').textContent = '表示期間: ' + text;
    }

    function resetResults() {
      document.getElementById('resultsArea').innerHTML = '';
      document.getElementById('dayCount').textContent = 0;
      document.getElementById('nightCount').textContent = 0;
      document.getElementById('totalCount').textContent = 0;
      document.getElementById('lastUpdated').textContent = '';
      lastSummary = null;
      document.body.classList.remove('print-summary');
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('modePersonal').classList.toggle('active', mode === 'personal');
      document.getElementById('modeWeekly').classList.toggle('active', mode === 'weekly');
      document.getElementById('modeDaily').classList.toggle('active', mode === 'daily');
      document.getElementById('navWeekly').classList.toggle('on', mode === 'weekly');
      document.getElementById('nameField').style.display = mode === 'personal' ? '' : 'none';
      document.getElementById('counts').style.display = mode === 'weekly' ? 'none' : '';
      // 日払いは「日」を選ぶ（期間は使わない）
      document.getElementById('periodField').hidden = mode === 'daily';
      document.getElementById('dayField').hidden = mode !== 'daily';
      document.getElementById('periodInfo').style.display = mode === 'daily' ? 'none' : '';
      resetResults();
    }

    // ── 日払い（他社）：その日に出た人の一覧。済は「その日の分を払った」印（この端末に覚える） ──
    function loadDays(monthId) {
      var sel = document.getElementById('daySelect');
      sel.disabled = true;
      sel.innerHTML = '<option value="">読み込み中...</option>';
      return jsonp({ action: 'days', month: monthId }).then(function (days) {
        sel.innerHTML = '';
        var today = new Date(), pick = '';
        (days || []).forEach(function (d) {
          var o = document.createElement('option');
          o.value = d.day; o.textContent = d.label;
          sel.appendChild(o);
          if (d.day === today.getDate()) pick = String(d.day);
        });
        if (!days || !days.length) sel.innerHTML = '<option value="">日のシートがありません</option>';
        // 今月なら今日、ちがう月なら1日目
        var monthSel = document.getElementById('monthSelect'), opt = monthSel.options[monthSel.selectedIndex];
        var isThisMonth = opt && opt.getAttribute('data-ym') === getCurrentYm();
        if (isThisMonth && pick) sel.value = pick;
        sel.disabled = !days || !days.length;
      }).catch(function (err) {
        sel.innerHTML = '<option value="">エラー: ' + err.message + '</option>';
      });
    }
    function dailyKey(monthId, day, shift, name) { return 'd|' + monthId + '|' + day + '|' + shift + '|' + name; }
    function doDaily(forceRefresh) {
      var monthId = document.getElementById('monthSelect').value;
      var day = document.getElementById('daySelect').value;
      var resultsArea = document.getElementById('resultsArea');
      if (!monthId) { resultsArea.innerHTML = '<div class="empty">年月を選択してください</div>'; return Promise.resolve(); }
      if (!day) { resultsArea.innerHTML = '<div class="empty">日を選択してください</div>'; return Promise.resolve(); }
      resultsArea.innerHTML = '<div class="loading">読み込み中...</div>';
      return jsonp({ action: 'daily', month: monthId, day: day, refresh: forceRefresh ? '1' : '0' }).then(function (data) {
        updateLastUpdated();
        renderDaily(data, monthId, day);
      }).catch(function (err) {
        resultsArea.innerHTML = '<div class="empty">エラー: ' + err.message + '</div>';
      });
    }
    function renderDaily(data, monthId, day) {
      var resultsArea = document.getElementById('resultsArea');
      resultsArea.innerHTML = '';
      renderUnknown(data.unknown);
      var rows = data.rows || [], paid = loadPaid();
      var dn = 0, nn = 0;
      rows.forEach(function (r) { if (r.shift === '夜') nn += r.times; else dn += r.times; });
      document.getElementById('dayCount').textContent = dn;
      document.getElementById('nightCount').textContent = nn;
      document.getElementById('totalCount').textContent = dn + nn;
      if (!rows.length) {
        var empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = (data.label || '') + ' に出た人はいません';
        resultsArea.appendChild(empty);
        return;
      }
      [['昼', '日勤', ICON_SUN], ['夜', '夜勤', ICON_MOON]].forEach(function (s) {
        var list = rows.filter(function (r) { return r.shift === s[0]; });
        if (!list.length) return;
        var head = document.createElement('div');
        head.className = 'day-sec';
        head.innerHTML = '<span class="badge ' + (s[0] === '夜' ? 'night' : 'day') + '">' + s[2] + '</span>' + s[1] + '<span class="n"></span>';
        resultsArea.appendChild(head);
        var box = document.createElement('div');
        resultsArea.appendChild(box);
        var cnt = head.querySelector('.n');
        var count = function () {
          var done = box.querySelectorAll('.day-row.paid').length;
          cnt.textContent = list.length + '人' + (done ? '（済 ' + done + '）' : '');
        };
        // 済でない人を上、済の人を下に
        var isPaid = function (r) { return !!paid[dailyKey(monthId, day, r.shift, r.name)]; };
        list.filter(function (r) { return !isPaid(r); }).concat(list.filter(isPaid)).forEach(function (r) {
          var key = dailyKey(monthId, day, r.shift, r.name);
          var row = document.createElement('label');
          row.className = 'day-row' + (r.shift === '夜' ? ' night' : '') + (paid[key] ? ' paid' : '');
          var main = document.createElement('div');
          main.className = 'dm';
          var nm = makeSpan('dn', r.name);
          if (r.times > 1) nm.appendChild(makeSpan('times', '×' + r.times));
          main.appendChild(nm);
          var site = document.createElement('div');
          site.className = 'ds';
          site.textContent = r.site || '';
          if (r.alert) site.style.color = r.alert;
          main.appendChild(site);
          row.appendChild(main);
          var cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = !!paid[key];
          cb.setAttribute('aria-label', r.name + ' 済');
          cb.addEventListener('change', function () {
            var p = loadPaid();
            if (cb.checked) p[key] = 1; else delete p[key];
            savePaid(p);
            row.classList.toggle('paid', cb.checked);
            var firstPaid = null;
            Array.prototype.some.call(box.children, function (el) { if (el !== row && el.classList.contains('paid')) { firstPaid = el; return true; } return false; });
            if (cb.checked) box.appendChild(row); else box.insertBefore(row, firstPaid);
            count();
          });
          row.appendChild(cb);
          box.appendChild(row);
        });
        count();
      });
    }

    function onMonthChange() {
      var monthSel = document.getElementById('monthSelect');
      var monthId = monthSel.value;
      var nameSel = document.getElementById('nameSelect');
      var periodSel = document.getElementById('periodSelect');

      resetResults();
      document.getElementById('periodInfo').textContent = '';

      if (!monthId) {
        nameSel.disabled = true;
        periodSel.disabled = true;
        nameSel.innerHTML = '<option value="">先に年月を選択</option>';
        return;
      }

      nameSel.innerHTML = '<option value="">読み込み中...</option>';
      periodSel.innerHTML = '<option value="全">全</option>';
      nameSel.disabled = true;
      periodSel.disabled = true;

      jsonp({ action: 'names', month: monthId }).then(function (names) {
        nameSel.innerHTML = '<option value="">選択してください</option>';
        names.forEach(function (n) {
          var opt = document.createElement('option');
          opt.value = n;
          opt.textContent = n;
          nameSel.appendChild(opt);
        });
        nameSel.disabled = false;
      }).catch(function (err) {
        nameSel.innerHTML = '<option value="">エラー: ' + err.message + '</option>';
      });

      if (CO) loadDays(monthId);   // 日払いの「日」（他社のときだけ）
      jsonp({ action: 'periods', month: monthId }).then(function (periods) {
        periodSel.innerHTML = '';
        periodMeta = {};
        periodList = periods.slice();
        periods.forEach(function (p) {
          var opt = document.createElement('option');
          opt.value = p.label;
          opt.textContent = p.label;
          if (p.label === '全') opt.selected = true;
          periodSel.appendChild(opt);
          periodMeta[p.label] = p.startLabel;
        });
        periodSel.disabled = false;
        updatePeriodInfo();
      }).catch(function (err) {
        periodSel.innerHTML = '<option value="">エラー: ' + err.message + '</option>';
      });
    }

    function updateLastUpdated() {
      var d = new Date();
      var hh = ('0' + d.getHours()).slice(-2);
      var mm = ('0' + d.getMinutes()).slice(-2);
      document.getElementById('lastUpdated').textContent = '最終更新: ' + hh + ':' + mm;
    }

    function doSearch(forceRefresh) {
      var monthId = document.getElementById('monthSelect').value;
      var name = document.getElementById('nameSelect').value;
      var period = document.getElementById('periodSelect').value;
      var resultsArea = document.getElementById('resultsArea');

      if (!monthId) {
        resultsArea.innerHTML = '<div class="empty">年月を選択してください</div>';
        return Promise.resolve();
      }
      if (!name) {
        resultsArea.innerHTML = '<div class="empty">名前を選択してください</div>';
        document.getElementById('dayCount').textContent = 0;
        document.getElementById('nightCount').textContent = 0;
        document.getElementById('totalCount').textContent = 0;
        return Promise.resolve();
      }

      resultsArea.innerHTML = '<div class="loading">検索中...</div>';

      return jsonp({
        action: 'search',
        month: monthId,
        name: name,
        period: period,
        refresh: forceRefresh ? '1' : '0'
      }).then(function (data) {
        document.getElementById('dayCount').textContent = data.dayCount;
        document.getElementById('nightCount').textContent = data.nightCount;
        document.getElementById('totalCount').textContent = data.dayCount + data.nightCount;
        updateLastUpdated();

        resultsArea.innerHTML = searchCardsHtml(data.results);
      }).catch(function (err) {
        resultsArea.innerHTML = '<div class="empty">エラー: ' + err.message + '</div>';
      });
    }

    var ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></svg>';
    var ICON_MOON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" fill="currentColor"/></svg>';
    // 個人検索の結果（1日ずつのカード）。週払いで名前を押したときにも使う
    function searchCardsHtml(results) {
      if (!results || results.length === 0) return '<div class="empty">該当するデータがありません</div>';
      var grouped = [];
      results.forEach(function (row) {
        var last = grouped[grouped.length - 1];
        if (last && last.row[0] === row[0] && last.row[1] === row[1] && last.row[2] === row[2]) {
          last.count++;
        } else {
          grouped.push({ row: row, count: 1 });
        }
      });
      var html = '';
      grouped.forEach(function (g) {
        var row = g.row;
        var date = row[0], shift = row[1], address = row[2], isAlert = row[3], alertColor = row[4];
        var badgeClass = shift === '夜' ? 'night' : 'day';
        var addressClass = isAlert ? 'address alert' : 'address';
        var alertStyle = isAlert && alertColor ? ' style="color:' + alertColor + '"' : '';
        var timesHtml = g.count > 1 ? '<span class="times">×' + g.count + '</span>' : '';
        html += '<div class="card ' + badgeClass + '">' +
          '<span class="badge ' + badgeClass + '" role="img" aria-label="' + (shift === '夜' ? '夜勤' : '日勤') + '">' + (shift === '夜' ? ICON_MOON : ICON_SUN) + '</span>' +
          '<div class="info">' +
            '<div class="date">' + date + timesHtml + '</div>' +
            '<div class="' + addressClass + '"' + alertStyle + '>' + address + '</div>' +
          '</div></div>';
      });
      return html;
    }

    // 週払い：名前を押すと、その人の勤務の内訳（個人検索と同じ）をすぐ下に開く。もう一度押すと閉じる
    var detailCache = {};
    function toggleDetail(r, row, detail, monthId, period) {
      var open = detail.hidden;
      detail.hidden = !open;
      row.classList.toggle('open', open);
      if (!open) return Promise.resolve();
      var key = monthId + '|' + period + '|' + r.name;
      if (detailCache[key]) { detail.innerHTML = detailCache[key]; return Promise.resolve(); }
      detail.innerHTML = '<div class="loading">読み込み中...</div>';
      return jsonp({ action: 'search', month: monthId, name: r.name, period: period, refresh: '0' }).then(function (data) {
        var html = '<div class="detail-count">日勤 ' + data.dayCount + '・夜勤 ' + data.nightCount + '・合計 ' + (data.dayCount + data.nightCount) + '</div>' +
          searchCardsHtml(data.results);

        detail.innerHTML = html;
      }).catch(function (err) {
        detail.innerHTML = '<div class="empty">エラー: ' + err.message + '</div>';
      });
    }

    var PAID_STORAGE_KEY = CO ? 'otherPaidChecks' : 'weeklyPaidChecks';   // 他社の済は、自社とは別に覚える

    function loadPaid() {
      try {
        return JSON.parse(localStorage.getItem(PAID_STORAGE_KEY) || '{}') || {};
      } catch (e) {
        return {};
      }
    }

    function savePaid(obj) {
      try {
        localStorage.setItem(PAID_STORAGE_KEY, JSON.stringify(obj));
      } catch (e) {}
    }

    function paidKey(monthId, period, name) {
      return monthId + '|' + period + '|' + name;
    }

    function makeSpan(className, text) {
      var el = document.createElement('span');
      el.className = className;
      el.textContent = text;
      return el;
    }

    function makeCell(tag, text, cls) {
      var el = document.createElement(tag);

      if (cls) el.className = cls;

    }

    // 週払いの印刷（A4縦1枚）：パソコンの管理画面の印刷と同じ形（2026-11-17）
    //  上に「令和〇年〇月／週払い／アイコンと会社名」、その下に週払いの範囲。左右2段に名前・日勤・夜勤・合計。
    //  済・月払いの人は出さない。色は会社のアイコン（青・緑）
    function pEsc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    // 週払いの範囲（出勤簿の読み方と同じ決まり：木曜締め。前の木曜の夜勤から、その木曜の日勤まで）
    function printRange(per) {
      var list = periodList.filter(function (p) { return p.label !== '全'; });
      if (per === '全') return '月の全期間';
      var i = -1;
      list.forEach(function (p, k) { if (p.label === per) i = k; });
      if (i < 0) return per;
      var p = list[i], end = String(p.label).replace(/\(月末\)$/, ''), start = p.startLabel || end, isEnd = /\(月末\)$/.test(p.label);
      if (isEnd && start === end && i > 0) return end + ' 夜勤';
      return start + ' ' + (i === 0 ? '日勤' : '夜勤') + ' 〜 ' + end + ' ' + (isEnd ? '夜勤' : '日勤');
    }

    function buildPrintArea() {
      if (!lastSummary) return;

      var monthSel = document.getElementById('monthSelect');
      var monthOpt = monthSel.options[monthSel.selectedIndex];
      var monthLabel = monthOpt ? monthOpt.textContent : '';
      var rows = lastSummary.rows.filter(function (r) { return !isMonthly(r.name); }); // 月払いの人は印刷しない
      var p2 = function (n) { return ('0' + n).slice(-2); };
      var now = new Date();
      var printed = (now.getMonth() + 1) + '/' + now.getDate() + ' ' + now.getHours() + ':' + p2(now.getMinutes());
      var at = summaryLoadedAt || now;
      var madeAt = (at.getMonth() + 1) + '/' + at.getDate() + ' ' + at.getHours() + ':' + p2(at.getMinutes());

      var sd = 0, sn = 0;
      rows.forEach(function (r) { sd += Number(r.day) || 0; sn += Number(r.night) || 0; });
      var per = Math.max(1, Math.ceil(rows.length / 2));
      var L = rows.slice(0, per), R = rows.slice(per), body = '';
      var cell = function (r, cls) {
        if (!r) return '<td class="nm' + cls + '"></td><td></td><td></td><td></td>';
        return '<td class="nm' + cls + '">' + pEsc(r.name) + '</td><td>' + (r.day || '') + '</td><td>' + (r.night || '') + '</td><td class="t">' + (r.total || '') + '</td>';
      };
      for (var i = 0; i < per; i++) body += '<tr class="' + (i % 2 ? 'odd' : '') + '">' + cell(L[i], '') + cell(R[i], ' rb') + '</tr>';
      var colg = '<col style="width:22%"><col style="width:9%"><col style="width:9%"><col style="width:10%">';
      var head = '<th>名前</th><th>日勤</th><th>夜勤</th><th>合計</th>';

      var area = document.getElementById('printArea');
      area.innerHTML = '<div class="wkp-page">' +
        '<div class="wkp-printed">印刷 ' + pEsc(printed) + '</div>' +
        '<div class="wkp-head"><div class="ym">' + pEsc(monthLabel) + '</div><div class="t">週払い</div>' +
        (CO ? '<div class="co"><span>' + pEsc(document.getElementById('coTag').textContent) + '</span></div></div>'
          : '<div class="co"><img src="icon.png" alt="" onerror="this.style.display=\'none\'"><span>I・C警備保障株式会社</span></div></div>') +
        '<div class="wkp-range"><b>' + pEsc(printRange(lastSummary.period)) + '</b><span>（' + pEsc(madeAt) + ' 時点の出勤簿）</span></div>' +
        '<table><colgroup>' + colg + colg + '</colgroup><thead><tr>' + head + head.replace('<th>', '<th class="rb">') + '</tr></thead><tbody>' + body +
        '<tr class="sum"><td colspan="4" style="text-align:left">週払い ' + rows.length + '人</td><td class="rb">合計</td><td>' + sd + '</td><td>' + sn + '</td><td>' + (sd + sn) + '</td></tr>' +
        '</tbody></table></div>';

      // A4の高さ（297mm）に収まるまで文字を小さくする（見えない所に広げて測る）
      area.classList.add('wkp-measure');
      var pg = area.querySelector('.wkp-page'), fs = 12;
      var mm = function () { return pg.scrollHeight * 25.4 / 96; };
      area.style.fontSize = fs + 'pt';
      while (mm() > 290 && fs > 6) { fs -= 0.25; area.style.fontSize = fs + 'pt'; }
      area.classList.remove('wkp-measure');
    }

    function printSummary() {
      if (!lastSummary) return;
      buildPrintArea();
      document.body.classList.add('print-summary');
      // 会社のアイコンを読み込んでから印刷の画面を出す
      var img = document.querySelector('#printArea img');
      var done = false;
      var go = function () { if (done) return; done = true; setTimeout(function () { window.print(); }, 50); };
      if (img && !img.complete) { img.onload = img.onerror = go; setTimeout(go, 1500); }
      else go();
    }
    window.addEventListener('afterprint', function () {
      document.body.classList.remove('print-summary');
    });

    function renderUnknown(unknown) {
      if (!unknown || unknown.length === 0) return;
      var resultsArea = document.getElementById('resultsArea');

      var card = document.createElement('details');
      card.className = 'unknown-card';

      var summary = document.createElement('summary');
      summary.textContent = '⚠ 名簿(F列)にない名前 ' + unknown.length + '件';
      card.appendChild(summary);

      var note = document.createElement('div');
      note.className = 'unknown-note';
      note.textContent = '週払いの一覧に入っていません。新しい人や、表記の違い・入力ミスの可能性があります。';
      card.appendChild(note);

      unknown.forEach(function (u) {
        var row = document.createElement('div');
        row.className = 'unknown-item';
        row.appendChild(makeSpan('unknown-name', u.name));
        var where = u.where.join('、') + (u.count > u.where.length && u.where.length >= 3 ? ' ほか' : '');
        row.appendChild(makeSpan('unknown-meta', u.count + '回: ' + where));
        card.appendChild(row);
      });

      resultsArea.appendChild(card);
    }

    // 月払いの人（「支払区分」シートで月払いになっている人）
    var monthlyKeys = {};
    function nameKey(n) { return String(n || '').replace(/[\s　]/g, ''); }
    function setMonthly(names) {
      monthlyKeys = {};
      (names || []).forEach(function (n) { monthlyKeys[nameKey(n)] = true; });
    }
    function isMonthly(name) { return !!monthlyKeys[nameKey(name)]; }

    // ○ボタン：週払い ⇔ 月払い を切り替える（月払いにログインした端末だけ）
    function togglePayType(r, btn) {
      var toMonthly = !isMonthly(r.name);
      var token = '';
      try { token = localStorage.getItem('payToken') || ''; } catch (e) {}
      if (!token) {
        alert('週払い・月払いの切り替えは、「⋮」→「月払い」にログインしたことのある端末でだけできます。');
        return;
      }
      var msg = toMonthly
        ? r.name + ' さんを「月払い」にしますか？\n（週払いの合計と印刷から外れます）'
        : r.name + ' さんを「週払い」に戻しますか？';
      if (!confirm(msg)) return;
      btn.disabled = true;
      jsonp({ action: 'setPayType', token: token, name: r.name, monthly: toMonthly ? '1' : '0' }).then(function (res) {
        if (res.error) {
          var hint = res.error.indexOf('期限') >= 0
            ? '\n\n「⋮」→「月払い」を一度開くと、ログインが新しくなります。そのあと、もう一度押してください。' : '';
          alert(res.error + hint);
          btn.disabled = false;
          return;
        }
        setMonthly(res.monthly);
        renderSummary(lastSummary.rows, lastSummary.monthId, lastSummary.period, lastSummary.unknown);
      }).catch(function (err) {
        alert('エラー: ' + err.message);
        btn.disabled = false;
      });
    }

    function renderSummary(rows, monthId, period, unknown) {
      var resultsArea = document.getElementById('resultsArea');
      resultsArea.innerHTML = '';
      renderUnknown(unknown);

      if (!rows || rows.length === 0) {
        lastSummary = null;
        var empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = '該当するデータがありません';
        resultsArea.appendChild(empty);
        return;
      }

      lastSummary = { rows: rows, monthId: monthId, period: period, unknown: unknown };

      var paid = loadPaid();
      var weekly = rows.filter(function (r) { return !isMonthly(r.name); });
      var monthly = rows.filter(function (r) { return isMonthly(r.name); });

      var head = document.createElement('div');
      head.className = 'sum-head';
      head.appendChild(makeSpan('sum-type', ''));
      head.appendChild(makeSpan('sum-name', '名前'));
      head.appendChild(makeSpan('sum-num', '日勤'));
      head.appendChild(makeSpan('sum-num', '夜勤'));
      head.appendChild(makeSpan('sum-num', '合計'));
      head.appendChild(makeSpan('sum-check', '済'));

      // 名前の絞り込み（入れた文字を含む人だけ出す。空なら全員）
      var filterWrap = document.createElement('div');
      filterWrap.className = 'name-filter';
      var filterInput = document.createElement('input');
      filterInput.type = 'search';
      filterInput.placeholder = '名前で絞り込む（例：石）';
      filterInput.setAttribute('aria-label', '名前で絞り込む');
      var filterInfo = document.createElement('span');
      filterInfo.className = 'filter-info';
      filterWrap.appendChild(filterInput);
      filterWrap.appendChild(filterInfo);
      resultsArea.appendChild(filterWrap);
      resultsArea.appendChild(head);

      // 週払いの人の入れ物（「済」にした人は下へ、外した人は「済」の人たちの上へ動かす）
      var weeklyBox = document.createElement('div');
      var items = [];

      function addRow(r, isMon) {
        var key = paidKey(monthId, period, r.name);
        var row = document.createElement('div');
        row.className = 'sum-row' + (isMon ? ' monthly' : (paid[key] ? ' paid' : ''));

        var typeWrap = document.createElement('span');
        typeWrap.className = 'sum-type';
        var tb = document.createElement('button');
        tb.className = 'type-btn' + (isMon ? ' on' : '');
        tb.textContent = isMon ? '月' : '週';
        tb.title = isMon ? '月払い（押すと週払いに戻す）' : '週払い（押すと月払いにする）';
        tb.addEventListener('click', function () { togglePayType(r, tb); });
        typeWrap.appendChild(tb);
        row.appendChild(typeWrap);

        var nameEl = makeSpan('sum-name link', r.name);
        nameEl.setAttribute('role', 'button');
        nameEl.title = '押すと勤務の内訳を開きます';
        row.appendChild(nameEl);
        row.appendChild(makeSpan('sum-num day', r.day));
        row.appendChild(makeSpan('sum-num night', r.night));
        row.appendChild(makeSpan('sum-num', r.total));

        var checkWrap = document.createElement('span');
        checkWrap.className = 'sum-check';
        if (!isMon) {
          var cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = !!paid[key];
          cb.addEventListener('change', function () {
            var p = loadPaid();
            if (cb.checked) p[key] = 1;
            else delete p[key];
            savePaid(p);
            row.classList.toggle('paid', cb.checked);
            item.classList.toggle('paid', cb.checked);
            // 「済」にした人は一番下へ。外した人は「済」の人たちのすぐ上へ
            var firstPaid = null;
            Array.prototype.some.call(weeklyBox.children, function (el) {
              if (el !== item && el.classList.contains('paid')) { firstPaid = el; return true; }
              return false;
            });
            if (cb.checked) weeklyBox.appendChild(item);
            else weeklyBox.insertBefore(item, firstPaid);
          });
          checkWrap.appendChild(cb);
        }
        row.appendChild(checkWrap);
        var item = document.createElement('div');
        item.className = 'sum-item' + (!isMon && paid[key] ? ' paid' : '');
        item.appendChild(row);
        var detail = document.createElement('div');
        detail.className = 'sum-detail';
        detail.hidden = true;
        item.appendChild(detail);
        (isMon ? resultsArea : weeklyBox).appendChild(item);
        var toggle = function () { return toggleDetail(r, row, detail, monthId, period); };
        nameEl.addEventListener('click', toggle);
        items.push({ el: item, name: r.name });
      }

      // 「済」でない人を上に、「済」の人を下に（それぞれは今までの順番のまま）
      var isPaid = function (r) { return !!paid[paidKey(monthId, period, r.name)]; };
      weekly.filter(function (r) { return !isPaid(r); }).concat(weekly.filter(isPaid))
        .forEach(function (r) { addRow(r, false); });
      resultsArea.appendChild(weeklyBox);

      // 絞り込み：空白は無視、ひらがな・カタカナ、全角・半角の違いも気にしない
      var normName = function (s) {
        return String(s || '').normalize('NFKC').replace(/[\s　]/g, '').toLowerCase()
          .replace(/[ァ-ヶ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0x60); });
      };
      filterInput.addEventListener('input', function () {
        var q = normName(filterInput.value), shown = 0;
        items.forEach(function (x) {
          var hit = !q || normName(x.name).indexOf(q) >= 0;
          x.el.hidden = !hit;
          if (hit) shown++;
        });
        filterInfo.textContent = q ? shown + '人' : '';
      });

      // 週払いの合計（週払いの最後の人のすぐ下）
      var sumDay = 0, sumNight = 0;
      weekly.forEach(function (r) { sumDay += r.day; sumNight += r.night; });
      var total = document.createElement('div');
      total.className = 'sum-total';
      total.appendChild(makeSpan('sum-type', ''));
      total.appendChild(makeSpan('sum-name', '合計 ' + weekly.length + '人'));
      total.appendChild(makeSpan('sum-num day', sumDay));
      total.appendChild(makeSpan('sum-num night', sumNight));
      total.appendChild(makeSpan('sum-num', sumDay + sumNight));
      total.appendChild(makeSpan('sum-check', ''));
      resultsArea.appendChild(total);
      if (monthly.length) {
        var note = document.createElement('div');
        note.className = 'sum-total-note';
        note.textContent = '月払いの ' + monthly.length + '人は含みません';
        resultsArea.appendChild(note);
      }

      if (monthly.length) {
        var sec = document.createElement('div');
        sec.className = 'sum-section';
        sec.textContent = '月払いの人（' + monthly.length + '人・合計と印刷に入りません）';
        resultsArea.appendChild(sec);
        monthly.forEach(function (r) { addRow(r, true); });
      }

      var printBtn = document.createElement('button');
      printBtn.className = 'print-btn';
      printBtn.textContent = '印刷';
      printBtn.addEventListener('click', printSummary);
      resultsArea.appendChild(printBtn);
    }

    function doSummary(forceRefresh) {
      var monthId = document.getElementById('monthSelect').value;
      var period = document.getElementById('periodSelect').value;
      var resultsArea = document.getElementById('resultsArea');

      if (!monthId) {
        resultsArea.innerHTML = '<div class="empty">年月を選択してください</div>';
        return Promise.resolve();
      }

      resultsArea.innerHTML = '<div class="loading">集計中...</div>';
      if (forceRefresh) detailCache = {};   // ⟳ で読み直したときは、開いた内訳も読み直す

      // 月払いの区分は自社だけ（他社は全員、週払いの一覧に出す）
      var types = CO ? Promise.resolve({ monthly: [] }) : jsonp({ action: 'payTypes' }).catch(function () { return { monthly: [] }; });
      return Promise.all([jsonp({
        action: 'summary',
        month: monthId,
        period: period,
        refresh: forceRefresh ? '1' : '0'
      }), types]).then(function (res) {
        var data = res[0];
        setMonthly(res[1] && res[1].monthly);
        updateLastUpdated();
        summaryLoadedAt = new Date();
        renderSummary(data.rows, monthId, period, data.unknown);
      }).catch(function (err) {
        resultsArea.innerHTML = '<div class="empty">エラー: ' + err.message + '</div>';
      });
    }

    function doAction(forceRefresh) {
      return currentMode === 'weekly' ? doSummary(forceRefresh) : currentMode === 'daily' ? doDaily(forceRefresh) : doSearch(forceRefresh);
    }

    function doRefresh() {
      var btn = document.getElementById('refreshBtn');
      if (btn.disabled) return;
      btn.disabled = true;
      btn.classList.add('spinning');
      doAction(true).then(function () {
        btn.classList.remove('spinning');
        btn.disabled = false;
      });
    }

    document.getElementById('modePersonal').addEventListener('click', function () { setMode('personal'); });
    document.getElementById('modeWeekly').addEventListener('click', function () { setMode('weekly'); });
    document.getElementById('modeDaily').addEventListener('click', function () { setMode('daily'); });
    document.getElementById('daySelect').addEventListener('change', function () { if (currentMode === 'daily') resetResults(); });
    // 下のメニューの「週払い」：週払いの一覧にして、年月が選んであればすぐ集計する
    document.getElementById('navWeekly').addEventListener('click', function () {
      if (currentMode !== 'weekly') setMode('weekly');
      window.scrollTo(0, 0);
      if (document.getElementById('monthSelect').value) doAction(false);
    });
    // 月払い・請求額の画面の下のボタン「週払い」から来たとき（#weekly）：週払いを開く
    if (location.hash === '#weekly') {
      setMode('weekly');

    document.getElementById('retryBtn').addEventListener('click', function () {
      this.hidden = true;

      loadMonths();
    });
    document.getElementById('monthSelect').addEventListener('change', onMonthChange);
    document.getElementById('periodSelect').addEventListener('change', updatePeriodInfo);
    document.getElementById('searchBtn').addEventListener('click', function () { doAction(false); });
    document.getElementById('refreshBtn').addEventListener('click', doRefresh);
    document.getElementById('subtitle').textContent = formatToday();
    // ログインしていない端末は、データを読まずにログインの案内を出す
    //  他社に切り替えているときは、見られる人かを先に確かめてから読む（見られなければ自社に戻す）
    function setupCo(info) {
      var link = document.getElementById('coLink'), seg = document.getElementById('coSeg');
      if (!info || !info.allowed) {
        link.hidden = true; seg.hidden = true;
        if (CO) { try { sessionStorage.removeItem('coOther'); } catch (e) {} CO = ''; }
        return;
      }
      link.hidden = false;
      link.textContent = CO ? '自社（I・C警備保障）に戻す' : info.name + 'に切り替え';
      seg.hidden = false;
      document.getElementById('coOther').textContent = info.name;
      document.getElementById('coSelf').classList.toggle('on', !CO);
      document.getElementById('coOther').classList.toggle('on', !!CO);
      if (CO) {
        document.body.classList.add('co-other');
        document.getElementById('coTag').textContent = info.name;
        document.title = '出勤確認（' + info.name + '）';
      }
    }
    document.getElementById('coLink').addEventListener('click', function (ev) {
      ev.preventDefault();
      setCo(!CO);
    });
    // 今見ていない方を押したときだけ切り替える
    document.getElementById('coSelf').addEventListener('click', function () { if (CO) setCo(false); });
    document.getElementById('coOther').addEventListener('click', function () { if (!CO) setCo(true); });
    if (savedToken()) {
      var coInfo = jsonp({ action: 'otherInfo' }).catch(function () { return null; });
      if (CO) {
        // 他社：先に確かめる。週払いを最初に出す
        coInfo.then(function (info) {
          setupCo(info);
          if (CO) setMode('weekly');
          loadMonths();
        });
      } else {
        loadMonths();
        coInfo.then(setupCo);
      }
    } else showLogin('');
    // 月払いの画面でログインしてから「戻る」でもどったとき（画面が前のまま残っているとき）は、読み直す
    window.addEventListener('pageshow', function () {
      if (document.body.classList.contains('need-login') && savedToken()) location.reload();
    });

    // ⋮ メニュー（月払い）
    document.getElementById('moreBtn').addEventListener('click', function (ev) {
      ev.stopPropagation();
      var menu = document.getElementById('moreMenu');
      menu.hidden = !menu.hidden;
    });
    document.addEventListener('click', function () {
      document.getElementById('moreMenu').hidden = true;
    });
  </script>
</body>
</html>
